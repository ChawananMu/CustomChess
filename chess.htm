<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Chess Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-area">
            <div class="log-panel">
                <h3>Move Log</h3>
                <div id="move-log"></div>
            </div>
            <div id="chessboard"></div>
            <div class="side-panel">
                <div class="cost-display">
                    <div class="player-cost">
                        <h3>Black Points</h3>
                        <p id="black-points">Used: <span>0</span></p>
                        <p id="black-remaining">Remaining: <span>64</span></p>
                    </div>
                    <div class="player-cost">
                        <h3>White Points</h3>
                        <p id="white-points">Used: <span>0</span></p>
                        <p id="white-remaining">Remaining: <span>64</span></p>
                    </div>
                </div>
                <div class="pieces-list">
                    <h3>Pieces List</h3>
                    <div class="pieces">
                        <div class="piece" draggable="true" data-piece="King" data-cost="0">
                            <img src="./image/wKing.png" alt="King"> King (0)
                        </div>
                        <div class="piece" draggable="true" data-piece="Queen" data-cost="15">
                            <img src="./image/wQueen.png" alt="Queen"> Queen (15)
                        </div>
                        <div class="piece" draggable="true" data-piece="Rook" data-cost="8">
                            <img src="./image/wRook.png" alt="Rook"> Rook (8)
                        </div>
                        <div class="piece" draggable="true" data-piece="Bishop" data-cost="6">
                            <img src="./image/wBishop.png" alt="Bishop"> Bishop (6)
                        </div>
                        <div class="piece" draggable="true" data-piece="Knight" data-cost="6">
                            <img src="./image/wKnight.png" alt="Knight"> Knight (6)
                        </div>
                        <div class="piece" draggable="true" data-piece="Pawn" data-cost="1">
                            <img src="./image/wPawn.png" alt="Pawn"> Pawn (1)
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="button-container">
            <button id="reset-black">Reset Black</button>
            <button id="reset-white">Reset White</button>
            <button id="game-button" class="start">Start Game</button>
        </div>
    </div>
    <script src="board.js"></script>
    <script src="piece.js"></script>
</body>
</html>
